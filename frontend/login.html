<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examiner Login — ExamGuard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased">

  <!-- Top Minimal Header -->
  <header class="py-6 px-4 sm:px-8 border-b border-slate-200 bg-white">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-slate-900 via-indigo-950 to-emerald-600 flex items-center justify-center shadow-md border border-slate-700">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900">ExamGuard</span>
      </a>
      <a href="register.html" class="text-xs sm:text-sm font-semibold text-emerald-700 hover:text-emerald-800">
        New Institutional User? Create Account &rarr;
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 sm:p-10">
      
      <!-- Card Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-900 text-emerald-400 mb-3 shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900">Examiner Authentication</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Access the examination integrity and review portal</p>
      </div>

      <!-- Feedback Banner (Hidden by default) -->
      <div id="auth-feedback" class="hidden"></div>

      <!-- Form -->
      <form id="login-form" class="space-y-5" novalidate>
        
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Institutional Email
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path>
              </svg>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              placeholder="shruthika@examguard.edu" 
              class="block w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-slate-900"
            >
          </div>
        </div>

        <!-- Password Input with Show/Hide -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700">
              Password
            </label>
            <span class="text-[11px] text-slate-400">Min 8 characters</span>
          </div>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="••••••••" 
              class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-slate-900"
            >
            <button 
              type="button" 
              data-toggle-password="password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
              title="Toggle password visibility"
            >
              <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mode Toggle & Auto-fill -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center text-slate-600 cursor-pointer">
            <input type="checkbox" id="demo-mode-checkbox" checked class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
            <span class="ml-2 font-medium">Use Day 1 Demo Mode</span>
          </label>
          <button type="button" id="btn-demo-quickfill" class="font-semibold text-emerald-700 hover:text-emerald-800">
            Quick-fill credentials
          </button>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full py-3 px-4 text-sm font-bold rounded-xl bg-slate-900 hover:bg-slate-800 text-white shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 flex items-center justify-center"
        >
          Sign In to Examiner Console
        </button>

      </form>

      <!-- Bottom Switch to Register -->
      <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
        Don't have an examiner account yet? 
        <a href="register.html" class="font-bold text-emerald-700 hover:underline">Register institutional access</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-400">
    ExamGuard G2 • Secure Academic Examination Review Suite
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
